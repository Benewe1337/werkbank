<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Text aus PDF-Dateien herausholen, kopieren oder als .txt speichern." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Text aus PDF – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Text aus PDF</h1>
      <section class="work" aria-label="Arbeitsbereich">
        <div id="drop"></div>
        <p id="engine"></p>
        <p id="scan-hint" class="panel" hidden>
          In <span id="scan-name"></span> steckt kaum Text. Vermutlich ist sie gescannt.
          Versuch es mit der <a href="/tools/ocr/">Texterkennung (OCR)</a>.
        </p>
        <div id="preview" class="text-preview" hidden>
          <div class="row">
            <h2 id="preview-title" class="preview-title"></h2>
            <button id="copy" class="button ghost" type="button">Text kopieren</button>
            <span id="copy-status" class="hint" role="status"></span>
          </div>
          <pre id="text" class="code" tabindex="0" aria-labelledby="preview-title"></pre>
        </div>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
