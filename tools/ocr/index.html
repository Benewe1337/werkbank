<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Text in Fotos, Scans und gescannten PDFs erkennen (OCR), auf Deutsch und Englisch." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Text erkennen (OCR) – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Text erkennen</h1>
      <section class="work" aria-label="Arbeitsbereich">
        <div id="drop"></div>
        <fieldset class="options">
          <legend class="visually-hidden">Optionen</legend>
          <label class="field">
            Sprache
            <select id="lang">
              <option value="deu">Deutsch</option>
              <option value="eng">Englisch</option>
              <option value="deu+eng">Deutsch und Englisch</option>
            </select>
          </label>
          <label class="field check"><input type="checkbox" id="pdf" /> Durchsuchbares PDF erzeugen</label>
        </fieldset>
        <p id="engine"></p>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
