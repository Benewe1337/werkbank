<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Audio- und Videodateien in MP3, M4A, OGG, Opus, FLAC oder WAV umwandeln, auch den Ton aus einem Video ziehen. Ohne Werbung, ohne Upload, läuft im Browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Audio umwandeln – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Audio umwandeln</h1>
      <p class="lede">
        Audio in ein anderes Format bringen.
        <em>Legst du ein Video ab, kommt sein Ton als eigene Datei heraus.</em>
      </p>
      <section class="work" aria-label="Arbeitsbereich">
        <div class="options">
          <label class="field">
            Format
            <select id="format"></select>
          </label>
          <label class="field">
            Bitrate
            <select id="bitrate"></select>
          </label>
          <p id="bitrate-hint" class="hint" hidden>Verlustfrei, eine Bitrate gibt es hier nicht.</p>
        </div>
        <div id="drop"></div>
        <p id="engine"></p>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
