<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Hintergrund aus Fotos entfernen und als PNG mit Transparenz speichern." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hintergrund entfernen – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Hintergrund entfernen</h1>
      <section class="work" aria-label="Arbeitsbereich">
        <div id="drop"></div>
        <p class="hint">Beim ersten Bild werden rund 44 MB geladen. Ein Foto dauert 5 bis 30 Sekunden.</p>
        <p id="engine"></p>
        <div id="preview" class="stage" hidden><img id="preview-img" alt="Ergebnis ohne Hintergrund" /></div>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
