<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Prüfsummen berechnen: MD5, SHA-1, SHA-256, SHA-512, SHA3-256, BLAKE3 und CRC32, auch für große Dateien." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Prüfsummen berechnen – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Prüfsummen berechnen</h1>
      <section class="work stack" aria-label="Arbeitsbereich">
        <fieldset class="options" id="algorithms">
          <legend class="visually-hidden">Verfahren</legend>
        </fieldset>
        <label class="field grow">Erwarteter Wert (optional, zum Vergleichen)<input type="text" id="expected" spellcheck="false" autocomplete="off" placeholder="z. B. SHA-256 von der Download-Seite einfügen" /></label>
        <p id="verdict" aria-live="polite" hidden></p>
        <div id="drop"></div>
        <p id="engine"></p>
        <ol class="result-list" id="results"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
