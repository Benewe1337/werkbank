<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Einen Ausschnitt aus einem Video als GIF speichern, mit eigener Farbpalette für saubere Farben. Ohne Werbung, ohne Upload, läuft im Browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Video in GIF – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Video in GIF</h1>
      <p class="lede">
        Einen kurzen Ausschnitt als GIF speichern.
        <em>Die Farben werden aus dem Ausschnitt selbst gewählt.</em>
      </p>
      <section class="work" aria-label="Arbeitsbereich">
        <div id="drop"></div>
        <div id="preview" hidden></div>
        <form id="form" class="options" novalidate hidden>
          <div class="field grow">
            <label for="start">Start</label>
            <span class="time-field">
              <input id="start" type="text" inputmode="decimal" placeholder="0:00" autocomplete="off" />
              <button id="take-start" class="button ghost" type="button" aria-label="Aktuelle Position als Start">Aktuelle Position</button>
            </span>
          </div>
          <label class="field">
            Dauer in Sekunden
            <input id="duration" type="number" min="0.1" max="30" step="0.1" value="5" />
          </label>
          <label class="field">
            Bilder pro Sekunde
            <select id="fps"></select>
          </label>
          <label class="field">
            Breite
            <select id="width"></select>
          </label>
          <p id="form-error" class="error" role="alert"></p>
          <button id="run" class="button" type="submit">GIF erstellen</button>
        </form>
        <p id="engine"></p>
        <div id="result" class="result-stage" hidden>
          <div class="stage"><img id="result-image" alt="Vorschau des erstellten GIFs" /></div>
        </div>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
