<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="JPG, PNG, WebP und AVIF verkleinern oder umwandeln." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Bilder komprimieren – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Bilder komprimieren</h1>
      <section class="work" aria-label="Arbeitsbereich">
        <fieldset class="options">
          <legend class="visually-hidden">Einstellungen</legend>
          <label class="field">
            Format
            <select id="format">
              <option value="same">wie Eingabe</option>
              <option value="jpeg">JPG</option>
              <option value="png">PNG (verlustfrei)</option>
              <option value="webp">WebP</option>
              <option value="avif">AVIF</option>
            </select>
          </label>
          <label class="field grow">
            <span>Qualität <output id="quality-value"></output></span>
            <input id="quality" type="range" min="1" max="100" value="75" />
          </label>
        </fieldset>
        <div id="drop"></div>
        <p class="hint">Metadaten wie Kamera und GPS-Position werden beim Neukodieren nicht übernommen. AVIF braucht etwas länger.</p>
        <div class="row">
          <button id="again" class="button ghost" type="button">Mit neuen Einstellungen wiederholen</button>
          <span id="engine"></span>
        </div>
        <ol id="jobs"></ol>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
