<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CSV-, Parquet- und JSON-Dateien mit SQL abfragen (DuckDB) und das Ergebnis als CSV speichern. Ohne Werbung, ohne Upload, läuft im Browser." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tabellen mit SQL abfragen – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Tabellen mit SQL abfragen</h1>
      <p class="lede">CSV, Parquet und JSON mit SQL durchsuchen, filtern und verknüpfen. <em>Mit DuckDB, direkt im Browser.</em></p>
      <section class="work stack" aria-label="Arbeitsbereich">
        <div id="drop"></div>
        <p id="engine"></p>
        <ol class="result-list" id="tables"></ol>
        <label class="field">SQL-Abfrage<textarea id="sql" class="sql" spellcheck="false" rows="6">SELECT 42 AS antwort;</textarea></label>
        <p class="hint">Jede Datei ist eine Tabelle. Strg/⌘ + Enter führt die Abfrage aus.</p>
        <div class="row">
          <button class="button" type="button" id="run">Abfrage ausführen</button>
          <button class="button ghost" type="button" id="export" disabled>Ergebnis als CSV</button>
        </div>
        <p class="hint status-line" id="status" aria-live="polite"></p>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="table-wrap" id="result" hidden></div>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
