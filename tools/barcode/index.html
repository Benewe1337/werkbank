<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Barcodes erstellen: EAN-13, EAN-8, UPC-A, Code 128, Code 39, ITF, DataMatrix, PDF417 und Aztec. Mit Prüfziffer, als SVG oder PNG." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Barcode erstellen – Werkbank</title>
  </head>
  <body>
    <!--header-->
    <main class="page">
      <h1>Barcode erstellen</h1>
      <section class="work stack" aria-label="Arbeitsbereich">
        <form id="form" class="options" autocomplete="off">
          <label class="field">Format<select name="format" id="format"></select></label>
          <label class="field grow">Inhalt<input type="text" name="text" id="text" spellcheck="false" /></label>
          <label class="field check"><input type="checkbox" name="hrt" id="hrt" checked />Klartext darunter</label>
          <label class="field">PNG-Größe
            <select name="scale" id="scale">
              <option value="2">klein (2 px pro Modul)</option>
              <option value="4" selected>mittel (4 px)</option>
              <option value="8">groß (8 px)</option>
              <option value="12">sehr groß (12 px)</option>
            </select>
          </label>
        </form>
        <p id="engine"></p>
        <div class="stage" id="preview"></div>
        <p class="hint status-line" id="note"></p>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="row">
          <button class="button" type="button" id="download-svg" disabled>SVG herunterladen</button>
          <button class="button ghost" type="button" id="download-png" disabled>PNG herunterladen</button>
        </div>
      </section>
    </main>
    <!--footer-->
    <script type="module" src="./main.js"></script>
  </body>
</html>
